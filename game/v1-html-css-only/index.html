<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">


    <link rel="stylesheet" href="styles.css">

</head>


<body>
    <header>
        <img src="" id="soundtoggle" alt="sound toggle" width="" height="">
        <h1>Game Name</h1>
        <h2 class="info">How to Play</h2>
    </header>

    <img src="" class="banner" alt="image banner" width="" height="">

    <main>

        <div id="playerone">
           <p class="score"></p>
           <img src="" alt="p1 avatar" class="avatar" width="" height="">
           <p class="identifier">Player 1</p> 
        </div>

        <div id="playarea">
            <div class="playareabtns">
                <button>Roll</button>
                <button>Pass</button>
            </div>
            
        </div>

        <div id="playertwo">
            <p class="score"></p>
            <img src="" alt="p2 avatar" class="avatar" width="" height="">
            <p class="identifier">Player 2</p> 
        </div>

    </main>
    
    <section id="textnotices">
        <h1>display text here</h1>
    </section>

    
</body>



</html>
