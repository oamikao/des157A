<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madlibs</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">


    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Jua&family=Schoolbell&display=swap" rel="stylesheet">

    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    
</head>


<body>

    <header>

        <h1>MadLibs</h1>

    </header>

    <!-- add class to each input field to get bth text and numbers for the loop check -->

    <main>
        <section id="inputform">
            <h1>Fill in the Blanks!</h1>
            <form id="wordForm">
                <div class="formsection"> <input type="text" id="adjective-1" class="inputfield"> <br><label for="adjective-1">(adjective) </label></div>
                <div class="formsection"> <input type="text" id="adjective-2" class="inputfield"> <br><label for="adjective-2">(adjective) </label></div>
                <div class="formsection"> <input type="text" id="emotion-1" class="inputfield"> <br><label for="emotion-1">(emotion) </label></div>
                <div class="formsection"> <input type="number" id="number-1" class="inputfield"> <br><label for="number-1">(number) </label></div>
                <div class="formsection"> <input type="text" id="adjective-3" class="inputfield"> <br><label for="adjective-3">(adjective)</label></div>
                <div class="formsection"> <input type="number" id="number-2" class="inputfield"> <br><label for="number-2">(number) </label></div>
                <div class="formsection"> <input type="text" id="verb-1" class="inputfield"> <br><label for="verb-1">(verb ending in -ed) </label></div>
                <div class="formsection"> <input type="text" id="exclamation" class="inputfield"> <br><label for="exclamation">(exclamation) </label></div>
                <div class="formsection"> <input type="text" id="adjective-4" class="inputfield"> <br><label for="adjective-4">(adjective) </label></div>
                <div class="formsection"> <input type="number" id="number-3" class="inputfield"> <br><label for="number-3">(number) </label></div>
                <div class="formsection"> <input type="text" id="adverb" class="inputfield"> <br><label for="adverb">(adverb) </label></div>
                <div class="formsection"> <input type="text" id="animal" class="inputfield"> <br><label for="animal">(animal) </label></div>
                <div class="formsection"> <input type="number" id="number-4" class="inputfield"> <br><label for="number-4">(number) </label></div>
                <div class="formsection"> <input type="text" id="verb-2" class="inputfield"> <br><label for="verb-2">(verb ending in -ing) </label></div>
                <div class="formsection"> <input type="text" id="adjective-5" class="inputfield"><br><label for="adjective-5">(adjective) </label></div>
                <div class="formsection"> <input type="text" id="emotion-2" class="inputfield"> <br><label for="emotion-2">(emotion) </label></div><br>
            </form>
            <button type="submit" form="wordForm"> See Story </button>
    </section>

    <section class="result">
        
    </section>
    </main>
    
    <footer>

    </footer>


</body>


</html>
