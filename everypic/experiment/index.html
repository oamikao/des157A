<html lang="en">

</body>

<script>
    console.log('reading JS');
    const info = document.querySelector('.info');
   
    document.querySelector('#sticker').addEventListener('mouseover', function(){
        console.log('over sticker');
        info.innerHTML = 'this is a sticker! Some sort of good luck charm';
    });

    document.querySelector('#sticker').addEventListener('mouseout', function(){
        info.innerHTML = '';
    });

</script>

</html>
