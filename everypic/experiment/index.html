<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Image Experiments</title>

    <link rel="stylesheet" href="styles.css">
    
</head>


<body>
    <header> 
        <h1>Experiment</h1>
    </header>
   
    
    <main> 
        <div class="cont">        
            <img src="images/img.png" alt="transparent img" id="sticker">
            <svg viewBox="0 0 171 131" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M69 3L83 9.5L90.5 3L97.5 0.5H109.5H118.5L131 9.5L133.5 20.5L141 23.5C143.167 25.1667 147.5 29.2 147.5 32C147.5 34.8 152.833 36.1667 155.5 36.5L163 39.5C165.333 42.8333 170 50.4 170 54V62C168.333 64 164.6 68.3 163 69.5C161.4 70.7 162.333 74.3333 163 76L170 87V94C166.667 95.5 159.1 99.1 155.5 101.5C151.9 103.9 154 106.833 155.5 108L147.5 112V118L137 121L128 130.5H113C108.5 128.667 99.1 124.2 97.5 121C95.9 117.8 92.1667 111 90.5 108H81L69 106.5L58.5 112L50 118L35.5 112C33.3333 112.667 28.2 113.6 25 112C21 110 10 110 10 106.5V98.5L3 94C2.16667 91.6667 0.5 86.4 0.5 84V76L10 67V54V44L15 36.5V28.5L19.5 20.5L29 16V9.5L45 3H69Z" fill="#B8B8B8" stroke="#8E8E8E" id="sticker-svg"/>
            </svg>
        </div>
    </main>
     <section><p class="info"></p></section>
  
</body>

<script>
    console.log('reading JS');
    const info = document.querySelector('.info');
   
    document.querySelector('svg').addEventListener('mouseover', function(){
        console.log('over sticker');
        info.innerHTML = 'this is a sticker! Some sort of good luck charm';
        document.querySelector('#sticker').className="large";
        document.querySelector('#sticker-svg').classList.add('large');
    });

    document.querySelector('#sticker').addEventListener('mouseout', function(){
        info.innerHTML = '';
    });

</script>

</html>
